# ==============================================================
#  MySQL profile - persistent storage.
#  Run with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#  Requires a MySQL server on localhost:3306 (schema auto-created).
# ==============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/honeypot_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false

# With a persistent DB, only seed if the tables are empty.
honeypot.ingest.seed-on-startup=true
