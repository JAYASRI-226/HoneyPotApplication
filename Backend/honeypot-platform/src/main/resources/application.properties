# ==============================================================
#  Hybrid Honeypot Intelligence Platform - default configuration
#  Default datasource is embedded H2 (zero setup). To use MySQL:
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# ==============================================================

spring.application.name=honeypot-platform
server.port=8080

# ---- Datasource: embedded H2 (in-memory, recreated on each start) ----
spring.datasource.url=jdbc:h2:mem:honeypot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=1234

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
# Quote identifiers that clash with reserved words (e.g. TIMESTAMP) per dialect.
spring.jpa.properties.hibernate.auto_quote_keyword=true

# ---- H2 web console (http://localhost:8080/h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================================
#  Honeypot ingestion settings
# ==============================================================
# Comma-separated Cowrie JSON log files to ingest (JSON-lines format).
honeypot.ingest.log-paths=C:/Users/WIN10/OneDrive/Desktop/HoneyPot-Application/honeypot/logs/cowrie.json,C:/Users/WIN10/OneDrive/Desktop/HoneyPot-Application/honeypot/logs/cowrie.json.2026-09-16
# Master switch for log ingestion.
honeypot.ingest.enabled=true
# Poll interval for tailing the log files for new lines.
honeypot.ingest.interval-ms=15000
# Ingest the sample logs once on startup so the dashboard has data immediately.
honeypot.ingest.seed-on-startup=true
# Geo enrichment for public IPs via a free lookup (off by default; private IPs are always local).
honeypot.ingest.geo-enrichment=false

# ---- Default sensor (represents the Cowrie honeypot that produced the logs) ----
honeypot.sensor.default-name=Cowrie SSH Honeypot
honeypot.sensor.default-type=SSH
honeypot.sensor.default-ip=172.19.0.3
